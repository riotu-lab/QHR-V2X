[tool.poetry]
name = "QHR-V2X"
version = "1.0.0"
description = "A comprehensive comparison of classical and quantum-enhanced pathfinding algorithms"
authors = ["Zahid Khan <z.khan@psu.edu.sa>", "Sultan Almogbil <s.almogbil@psu.edu.sa>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "3.11.5"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
pandas = "^2.0.0"
qiskit = "^0.44.0"
qiskit-aer = "^0.12.0"
reportlab = "^4.0.0"
tabulate = "^0.9.0"
scipy = "^1.10.0"
seaborn = "^0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
qhr-v2x = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
