[tool.poetry]
name = "QHR-V2X"
version = "1.0.0"
description = "A comprehensive comparison of classical and quantum-enhanced pathfinding algorithms"
authors = ["Zahid Khan <z.khan@psu.edu.sa>", "Sultan Almogbil <s.almogbil@psu.edu.sa>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
# The paper's results were produced on 3.11.5. The range is kept open across
# 3.11.x so a reproducer is not blocked by a patch-level mismatch; 3.12 is
# excluded because the pinned qiskit 0.44 does not support it.
python = ">=3.11,<3.12"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
pandas = "^2.0.0"
# Pinned to the versions the published figures were generated with. Kept as-is
# deliberately: the pin is part of the reproduction contract, not an oversight.
qiskit = "^0.44.0"
qiskit-aer = "^0.12.0"
scipy = "^1.10.0"
seaborn = "^0.12.0"
# Never imported by name, but pandas.DataFrame.to_markdown() requires it, and
# the harness writes markdown tables with it in tests/test_pathfinding_all.py
# and experiments/analysis/analyze_results.py. Removing it breaks both at runtime.
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
qhr-v2x = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
